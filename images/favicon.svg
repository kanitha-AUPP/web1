<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="WebPentest101 terminal logo">
  <!-- terminal window -->
  <rect x="2" y="2" width="28" height="28" rx="3" fill="#000000" stroke="#b5e853" stroke-width="1.6"/>
  <!-- title bar divider -->
  <line x1="2" y1="9.5" x2="30" y2="9.5" stroke="#b5e853" stroke-width="1" stroke-dasharray="2 2" opacity="0.6"/>
  <!-- title bar dots -->
  <circle cx="6" cy="5.9" r="1" fill="#b5e853"/>
  <circle cx="9.5" cy="5.9" r="1" fill="#b5e853" opacity="0.55"/>
  <circle cx="13" cy="5.9" r="1" fill="#b5e853" opacity="0.35"/>
  <!-- prompt: >_ -->
  <polyline points="7,15 11,19 7,23" fill="none" stroke="#b5e853" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="14" y1="23" x2="22" y2="23" stroke="#b5e853" stroke-width="2.3" stroke-linecap="round"/>
</svg>
